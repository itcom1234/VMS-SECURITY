name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install API
        working-directory: apps/api
        run: npm install
      - name: Prisma generate
        working-directory: apps/api
        run: npm exec prisma generate
      - name: Build API
        working-directory: apps/api
        run: npm run build
      - name: Install Web
        working-directory: apps/web
        run: npm install
      - name: Build Web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_MTX_HLS_URL: http://localhost:8888
          NEXT_PUBLIC_MTX_WEBRTC_URL: http://localhost:8889
        run: npm run build